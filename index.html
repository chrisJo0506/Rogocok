<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rogocok</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#fff7f0;
      overflow-x:hidden;
    }

    /* NAVBAR */

    header{
      width:100%;
      background:#9b6712;
      padding:15px 50px;
      position:sticky;
      top:0;
      z-index:100;
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .kiri{
      display:flex;
      align-items:center;
      gap:30px;
    }

    .logo{
      width:90px;
    }

    .menu{
      display:flex;
      gap:25px;
    }

    .menu a{
      text-decoration:none;
      color:white;
      font-weight:bold;
      transition:0.3s;
    }

    .menu a:hover{
      color:#ffd28f;
    }

    .brand{
      font-family:'Pacifico', cursive;
      color:white;
      font-size:40px;
    }

    .btn-nav{
      background:black;
      color:white;
      border:none;
      padding:14px 28px;
      border-radius:30px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    .btn-nav:hover{
      background:#3d2516;
    }

    /* HERO */

    .pos1{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:60px;
      padding:70px;
    }

    .judul{
      flex:1;
    }

    .judul h1{
      font-size:65px;
      color:#4e2f1f;
      line-height:1.1;
      margin-bottom:25px;
    }

    .judul p{
      font-size:18px;
      line-height:1.8;
      color:#555;
      margin-bottom:30px;
    }

    .harga{
      font-size:35px;
      font-weight:bold;
      color:#b85c38;
    }

    .judul button{
      margin-top:30px;
      background:#000;
      color:white;
      border:none;
      padding:18px 35px;
      border-radius:40px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .judul button:hover{
      background:#5a3825;
      transform:scale(1.05);
    }

    /* GAMBAR */

    .gambar{
      flex:1;
      display:flex;
      justify-content:center;
    }

    .gambar img{
      width:100%;
      max-width:500px;
      border-radius:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    /* RESPONSIVE */

    @media(max-width:900px){

      nav{
        flex-direction:column;
        gap:20px;
      }

      .kiri{
        flex-direction:column;
      }

      .menu{
        flex-wrap:wrap;
        justify-content:center;
      }

      .pos1{
        flex-direction:column;
        text-align:center;
        padding:40px 20px;
      }

      .judul h1{
        font-size:45px;
      }

      .gambar img{
        max-width:350px;
      }

      .brand{
        font-size:32px;
      }
    }

  </style>
</head>

<body>

  <header>

    <nav>

      <div class="kiri">

        <img class="logo" src="image/Rogocok.png" alt="Logo">

        <div class="menu">
          <a href="">About</a>
          <a href="">Menu</a>
          <a href="">Store</a>
        </div>

      </div>

      <h1 class="brand">Rogocok</h1>

      <button class="btn-nav">
        ORDER NOW
      </button>

    </nav>

  </header>

  <section class="pos1">

    <section class="judul">

      <h1>ROTI GORENG COKLAT</h1>

      <p>
        Nikmati sensasi manis dan renyahnya Roti Goreng Coklat “Rogocok”
        yang bikin ketagihan! Roti goreng hangat, lembut di dalam,
        dan lapisan coklat meleleh yang sempurna di setiap gigitannya.
        Cocok sebagai teman santai bersama keluarga dan teman.
      </p>

      <label class="harga">Rp. 10.000</label>

      <br>

      <button>CHECK SEKARANG</button>

    </section>

    <section class="gambar">
      <img src="image/roti.jpg" alt="Roti Goreng">
    </section>

  </section>

</body>
</html>
